[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bosfvg"
version = "0.1.0"
description = "BOS/FVG multi-timeframe options strategy: backtester, evaluation harness, and Alpaca paper-trading daemon."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyarrow>=15",
  "alpaca-py>=0.30",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
bosfvg = "bosfvg.cli:main"

[tool.setuptools.packages.find]
include = ["bosfvg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
